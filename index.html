  blurb: "Communication skills and professional behaviour, documentation, change management and disaster recovery, ethics and law, call centres and basic scripting.",
  q: [
  ["Communication", "Why does establishing a good rapport with a customer help troubleshooting?", ["A relaxed customer is more likely to provide the information you need", "It shortens the warranty period", "It removes the need to document the call", "It lets you skip closed-ended questions"], "Most people who need a computer fixed are feeling some stress."],
  ["Communication", "What do many call center technicians keep at their desk to monitor their facial expressions?", ["A mirror", "A second monitor", "A webcam recording", "A stopwatch"], "Customers can sense whether you are smiling when you speak on the phone."],
  ["Communication", "What is a good rule about moving from one customer call to the next?", ["A new customer call means a fresh start", "Mention the previous caller's problem", "Take a personal call in between", "Transfer the next call immediately"], "Never carry your frustration from one call to the next."],
  ["Communication", "Which rule means calling the customer by the name they prefer?", ["Know", "Relate", "Understand", "Escalate"], "The three rules are know, relate and understand."],
  ["Communication", "Which rule means determining the customer's level of knowledge about the computer?", ["Understand", "Know", "Relate", "Document"], "It helps you choose words the customer will follow."],
  ["Communication", "Which rule means creating a one-to-one connection with the customer?", ["Relate", "Know", "Understand", "Summarize"], "For example, finding something you have in common, without giving too much information."],
  ["Communication", "During active listening, what should you do while the customer explains the problem?", ["Occasionally interject a small word such as \"I understand\" or \"Yes\"", "Interrupt with closed-ended questions", "Type silently and say nothing", "Put the customer on hold"], "Do not interrupt; let the customer finish their thoughts."],
  ["Communication", "After the customer has explained the whole problem, what should you do next?", ["Summarize what the customer has said", "Transfer the call", "Ask them to repeat everything", "End the call"], "Then follow up with targeted closed-ended questions."],
  ["Communication", "What kind of question can be answered with \"yes\", \"no\" or a fact such as \"Windows 10\"?", ["Closed-ended", "Open-ended", "Rhetorical", "Leading"], "Open-ended questions invite the customer to explain what happened."],
  ["Professional", "Which of these is unprofessional behaviour with a customer?", ["Using jargon, abbreviations and acronyms", "Calling the customer by their preferred name", "Summarizing the problem", "Asking permission before a hold"], "Also do not minimize the customer's problems or argue with them."],
  ["Professional", "What should you never do with your experiences of customers?", ["Disclose them on social media", "Record them in the ticket", "Discuss the solution with the customer", "Document the time spent"], "It is on the course's list of things not to do."],
  ["Professional", "Before putting a customer on hold, what must you do?", ["Explain why and ask for the customer's permission", "Wait for them to stop for breath and press hold", "Tell them it will take an hour", "Transfer them first"], "Also thank the customer and say what you will be doing."],
  ["Professional", "When transferring a call, what should you tell the new technician?", ["Your name, the ticket number, and the customer's name", "Only that a call is coming", "The customer's password", "Nothing, to save time"], "This saves the customer repeating the whole story."],
  ["Professional", "What should you tell the customer before a transfer?", ["The name and number of the person they will be speaking with", "That the problem is their fault", "That you are too busy", "Nothing"], "Explain why, and ask for permission."],
  ["Customers", "A customer discusses everything except the problem. Which type is this?", ["Talkative", "Angry", "Knowledgeable", "Inexperienced"], "Allow about a minute, then refocus with closed-ended questions."],
  ["Customers", "How should you handle an angry customer?", ["Let them explain without interrupting, sympathize, and avoid holds and transfers", "Put them on hold until they calm down", "Raise your own voice", "Ask them to call back later"], "Apologize for the wait or inconvenience."],
  ["Customers", "A customer says they have already tried the basic steps and wants to control the call. Which type is this?", ["Knowledgeable", "Talkative", "Rude", "Inexperienced"], "Do not walk them through the obvious; consider a level two technician."],
  ["Customers", "How should you help an inexperienced customer?", ["Use a simple step-by-step process and plain terms", "Use industry jargon", "Escalate immediately", "Ask them to read the manual"], "Do not be condescending."],
  ["Customers", "A customer makes negative comments about the product and the technician. What should you NOT do?", ["Be rude in return", "Listen carefully", "Follow a step-by-step approach", "Apologize for the inconvenience"], "Stay calm and professional with a rude customer."],
  ["Documentation", "Which is a purpose of documentation?", ["Standardizing procedures so they can be repeated accurately", "Increasing the number of support calls", "Hiding information from new staff", "Replacing backups"], "Others: describing products, setting rules, reducing mistakes, compliance and training."],
  ["Documentation", "Into which four categories does IT documentation generally fall?", ["Policies, operations, projects, and user documentation", "Hardware, software, network, and security", "Daily, weekly, monthly, and yearly", "Public, private, hybrid, and community"], "Keeping it current is a challenge for every IT department."],
  ["Documentation", "What is an acceptable use policy (AUP)?", ["An agreement that defines the appropriate user access to resources or services", "A step-by-step installation guide", "A report written after a breach", "A list of hardware assets"], "It is a policy document."],
  ["Documentation", "What is another name for an incident report?", ["After-action report (AAR)", "Service Level Agreement", "End User License Agreement", "Change control worksheet"], "It documents a critical or major incident, such as a security breach."],
  ["Documentation", "What are standard operating procedures (SOP)?", ["Step-by-step instructions that guide employees in using computers and services", "A list of banned websites", "A contract with a supplier", "A backup schedule only"], "Goals: uniformity, consistent high-quality work, fewer miscommunications."],
  ["Documentation", "Which item belongs on an end-user termination checklist?", ["Deactivate account access and remove all account permissions", "Assign devices and give training", "Set up user accounts with permissions", "Sign the data privacy agreement"], "Also take back and wipe the device, and release software licenses."],
  ["Documentation", "What is a knowledge base?", ["A centralized repository of articles and documents", "A database of customer passwords", "A list of asset tags", "A type of firewall"], "It holds FAQs, troubleshooting scenarios and training documents."],
  ["Documentation", "What can failure to comply with laws and regulations lead to?", ["Fines, termination of employment, and even incarceration", "Faster network speeds", "Free software licences", "Extended warranties"], "Regulations often specify what data must be collected and how long it is retained."],
  ["Assets", "What is asset management?", ["Tracking and managing assets so they are used properly, maintained, upgraded and disposed of responsibly", "Buying the cheapest hardware", "Encrypting all company data", "Monitoring employee email"], "It needs an inventory of hardware, consumables, spares and software assets."],
  ["Assets", "What can an asset tag use to identify equipment?", ["A unique serial number, barcode, QR code, or RFID", "The user's password", "The IP address only", "The purchase price"], "It works with the asset management database."],
  ["Assets", "What is the correct order of the procurement life cycle?", ["Planning, procurement, deployment, maintenance, disposal", "Procurement, planning, disposal, deployment, maintenance", "Deployment, planning, procurement, disposal, maintenance", "Planning, deployment, procurement, maintenance, disposal"], "At disposal the asset is sanitized of any data."],
  ["Assets", "What must be done to an asset at the end of its life before it is sold, recycled or donated?", ["It must be sanitized of any data", "It must be upgraded", "It must be re-licensed", "It must be repainted"], "It can also be destroyed."],
  ["Change", "Which part of a change control worksheet describes how to return the system to operation if the change fails?", ["Back-out or recovery plan", "Scope of change", "Intended outcome", "Purpose of change"], "Risk analysis covers the potential risks of the change."],
  ["Change", "What does the scope of change describe?", ["The departments and services that will be impacted", "The cost of the hardware", "The technician's qualifications", "The licence key"], "The purpose explains why the change is necessary."],
  ["Disaster", "What is a disaster recovery plan?", ["A document describing how to restore operation quickly and keep critical IT functions running", "A list of installed software", "A warranty certificate", "An acceptable use policy"], "It can include offsite locations and backup connectivity options."],
  ["Disaster", "What is Phase 3 of creating a disaster recovery plan?", ["Verification", "Review", "Inventory and documentation", "Approval and implementation"], "The phases: recovery strategy, inventory and documentation, verification, approval and implementation, review."],
  ["Disaster", "Which is an advantage of cloud backups?", ["Scalability: no need to worry about storage capacity", "Restores do not depend on the Internet", "Full local control of the media", "No ongoing cost"], "A disadvantage is that backup and restore depend on Internet speed and reliability."],
  ["Disaster", "Which is an advantage of local backups?", ["Restore times are usually faster than over the Internet", "Unlimited capacity", "No need for off-site storage", "They are managed by a provider"], "They also remain accessible when network connectivity is lost."],
  ["Ethics", "What must you get before accessing a customer's computer accounts, including the administrator account?", ["The customer's permission", "A search warrant", "A second technician", "A new password"], "Respect customers and their property, which includes their data."],
  ["Ethics", "Which is an example of PII?", ["A passport number", "A router model number", "A software version", "A printer's page count"], "PII includes names, identification numbers, addresses and biometric data."],
  ["Ethics", "Which regulation governs how personal data is handled in the European Union?", ["GDPR", "HIPAA", "PCI DSS", "EULA"], "The General Data Protection Regulation."],
  ["Ethics", "What does PCI information relate to?", ["Payment cards: account numbers, expiration dates, and magnetic strip and chip data", "Patient health records", "Software source code", "Network topology"], "The PCI Security Standards Council was formed in 2005 by the five major credit card companies."],
  ["Ethics", "What is PHI?", ["Protected health information, such as patient names and dates of visits", "Public hardware inventory", "Private host identifier", "Payment handling information"], "In the United States it is regulated by HIPAA."],
  ["Ethics", "Which action is NOT permissible for a technician?", ["Changing system configurations without customer permission", "Documenting the steps taken", "Asking the customer to verify the fix", "Recording the time spent"], "Nor may you access accounts, files or email without permission."],
  ["Ethics", "A technician is required to do what with sensitive customer information?", ["Maintain its confidentiality", "Share it with colleagues", "Post it to the knowledge base", "Store it on a personal phone"], "It is not permissible to share sensitive customer information."],
  ["Licensing", "What is an End User License Agreement (EULA) an example of?", ["A personal software license", "An enterprise license", "An open source license", "Digital rights management"], "It is illegal to use licensed software without the appropriate license."],
  ["Licensing", "What is an enterprise license?", ["A software license held by a company for its employees to use", "A license for one home user", "A license that allows modifying source code", "A hardware warranty"], "It covers many users under one agreement."],
  ["Licensing", "What does an open source license allow?", ["Developers to modify and share the source code", "Unlimited commercial resale without terms", "Use without any conditions at all", "Removal of DRM from media"], "It is still a copyright license with terms."],
  ["Licensing", "What is digital rights management (DRM)?", ["Software designed to prevent illegal access to digital content and devices", "A type of backup", "A firewall rule", "A user account type"], "It protects copyrighted content."],
  ["Forensics", "What is computer forensics?", ["The collection and analysis of data in the course of a criminal investigation", "Repairing damaged hard drives", "Removing malware from a PC", "Installing security cameras"], "The data must be admissible as evidence in court."],
  ["Forensics", "Which type of data is lost when the computer is turned off?", ["Volatile data", "Persistent data", "Archived data", "Encrypted data"], "RAM, cache and registries contain volatile data."],
  ["Forensics", "What is persistent data?", ["Data stored on a local drive that is preserved when the computer is turned off", "Data held only in RAM", "Data in transit to the CPU", "Data in the cache"], "For example on an internal or external hard drive, or an optical drive."],
  ["Forensics", "You discover illegal activity on a running computer. What should you NOT do?", ["Turn off the computer", "Document what you found", "Follow company policy", "Note the time and date"], "Volatile data about the current state would be lost."],
  ["Forensics", "What does first response describe?", ["The official procedures used by people qualified to collect evidence", "The first call of the day", "The first step of the troubleshooting process", "An automatic email reply"], "If improperly performed, evidence might not be admissible in court."],
  ["Forensics", "What does the chain of custody track?", ["The collected evidence, and who has had access to it", "The order of calls in a queue", "The ownership of software licences", "The route of network packets"], "It also prevents evidence tampering."],

      '<button class="card" data-a="flip" aria-live="polite"><span class="term">' + esc(k.term) + "</span>" + (V.flip ? '<span class="def">' + esc(k.def) + "</span>" : '<span class="hint muted small">Say what it means, then tap to check.</span>') + "</button>" +
      '<div class="row" style="margin-top:1.2rem">' + (V.flip ? '<button class="btn ghost" data-a="learn">Still learning</button><button class="btn" data-a="know">I know this</button>' : '<button class="btn" data-a="flip">Show the meaning</button>') +
      '<button class="link" data-a="chapter" data-n="' + V.n + '" style="margin-left:auto">Leave</button></div>';
  }

  function render() {
    var v = V.name;
    app.innerHTML = '<div class="wrap">' + (v === "home" ? home() : v === "chapter" ? chapter(V.n) : v === "examsetup" ? examSetup() : v === "quiz" ? quiz() : v === "results" ? results() : cards()) + "</div>";
    if (v === "quiz" && V.secs) { tick(); if (!timer) timer = setInterval(tick, 1000); }
  }

  // ---------- actions ----------
  function act(a, el) {
    var n = el && el.getAttribute("data-n") ? +el.getAttribute("data-n") : 0, c, it;
    if (a === "home") go({ name: "home" });
    else if (a === "chapter") go({ name: "chapter", n: n });
    else if (a === "examsetup") go({ name: "examsetup" });
    else if (a === "cards") startCards(n, false);
    else if (a === "cardsagain") startCards(V.n, true);
    else if (a === "cardsall") { chap(V.n).cards.forEach(function (k) { delete S.c[k.id]; }); save(); startCards(V.n, false); }
    else if (a === "flip") { V.flip = !V.flip; render(); var b = app.querySelector(".card"); if (b) b.focus(); }
    else if (a === "know" || a === "learn") { S.c[V.deck[V.i].id] = a === "know" ? 1 : 0; if (a === "know") V.got++; save(); V.i++; V.flip = false; render(); var f = app.querySelector(".card,h1"); if (f) { f.setAttribute("tabindex", "-1"); f.focus(); } }
    else if (a === "practice") { c = chap(n); startSession("practice", pickPractice(c, 10), "Chapter " + n + " practice", { name: "chapter", n: n }); }
    else if (a === "test") { c = chap(n); var qs = shuffle(c.q).slice(0, 20); startSession("test", qs, "Chapter " + n + " test", { name: "chapter", n: n }, qs.length * 60); }
    else if (a === "missed") { var pool = []; (n ? [chap(n)] : OPEN).forEach(function (x) { pool = pool.concat(x.q.filter(qMissed)); }); startSession("missed", shuffle(pool), "Missed questions", n ? { name: "chapter", n: n } : { name: "home" }); }
    else if (a === "examstart") {
      var picked = [].slice.call(document.querySelectorAll('input[name="ch"]:checked')).map(function (i) { return +i.value; });
      if (!picked.length) { document.getElementById("setuperr").textContent = "Tick at least one chapter to draw questions from."; return; }
      var all = []; picked.forEach(function (p) { all = all.concat(chap(p).q); });
      var count = Math.min(+document.getElementById("count").value, all.length), set = shuffle(all).slice(0, count);
      startSession("exam", set, "Mixed exam, " + count + " questions", { name: "home" }, count * 60);
    }
    else if (a === "pick") {
      it = V.items[V.i]; var instant = V.mode === "practice" || V.mode === "missed";
      if (instant && it.pick !== null) return;
      it.pick = it.opts[+el.getAttribute("data-k")];
      if (instant) record(it.q, it.pick === it.q.opts[0]);
      render(); var nx = app.querySelector(instant ? '[data-a="next"]' : ".opt.sel"); if (nx) nx.focus();
    }
    else if (a === "next") { if (V.i < V.items.length - 1) { V.i++; render(); window.scrollTo(0, 0); var h2 = app.querySelector("h2"); if (h2) { h2.setAttribute("tabindex", "-1"); h2.focus({ preventScroll: true }); } } else finish(); }
    else if (a === "prev") { V.i--; render(); }
    else if (a === "finish") { var blank = V.items.filter(function (x) { return x.pick === null; }).length; if (blank && !el.getAttribute("data-sure")) { el.setAttribute("data-sure", "1"); el.textContent = blank + " not answered. Finish anyway"; return; } finish(); }
    else if (a === "quit") go(V.back);
    else if (a === "back") go(V.back);
    else if (a === "retry") { var w = V.items.filter(function (x) { return x.pick !== x.q.opts[0]; }).map(function (x) { return x.q; }); startSession("missed", shuffle(w), "Missed questions", V.back); }
    else if (a === "reset") { if (!el.getAttribute("data-sure")) { el.setAttribute("data-sure", "1"); el.textContent = "Tap again to clear this chapter's progress"; return; } c = chap(n); c.q.forEach(function (q) { delete S.q[q.id]; }); c.cards.forEach(function (k) { delete S.c[k.id]; }); save(); render(); }
  }
  document.addEventListener("click", function (e) { var el = e.target.closest ? e.target.closest("[data-a]") : null; if (el && !el.disabled) act(el.getAttribute("data-a"), el); });
  document.addEventListener("keydown", function (e) {
    if (V.name !== "quiz" || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = "abcd".indexOf(e.key.toLowerCase()); if (k < 0) k = "1234".indexOf(e.key);
    if (k >= 0 && k < V.items[V.i].opts.length) { var b = app.querySelectorAll(".opt")[k]; if (b && !b.disabled) act("pick", b); }
  });
  render();
})();
</script>
</body>
</html>
