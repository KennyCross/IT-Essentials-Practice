},
 { n: 7, title: "Laptops and Other Mobile Devices" }, { n: 8, title: "Printers" },
{ n: 9, title: "Virtualization and Cloud Computing" }, { n: 10, title: "Windows Installation" }, { n: 11, title: "Windows Configuration" },
{ n: 12, title: "Mobile, Linux, and macOS Operating Systems" }, { n: 13, title: "Security" }, { n: 14, title: "The IT Professional" },
];

(function () {
  "use strict";
  var KEY = "ite8-study-v1", TARGET = 70;
  var S = { q: {}, c: {} };
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && p.q && p.c) S = p; } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // give every question and card a stable id
  CHAPTERS.forEach(function (ch) {
    if (!ch.open) return;
    ch.q = ch.q.map(function (a, i) { return { id: "c" + ch.n + "q" + i, ch: ch.n, topic: a[0], text: a[1], opts: a[2], why: a[3] }; });
    ch.cards = ch.cards.map(function (a, i) { return { id: "c" + ch.n + "k" + i, term: a[0], def: a[1] }; });
  });
  var OPEN = CHAPTERS.filter(function (c) { return c.open; });
  function chap(n) { return CHAPTERS.filter(function (c) { return c.n === n; })[0]; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function two(n) { return (n < 10 ? "0" : "") + n; }

  function qRight(q) { return S.q[q.id] && S.q[q.id].last === 1; }
  function qMissed(q) { return S.q[q.id] && S.q[q.id].last === 0; }
  function stats(ch) {
    var r = ch.q.filter(qRight).length, k = ch.cards.filter(function (c) { return S.c[c.id] === 1; }).length;
    var total = ch.q.length + ch.cards.length;
    return { right: r, known: k, done: r + k, total: total, pct: total ? (r + k) / total : 0, missed: ch.q.filter(qMissed).length };
  }
  function pins(pct, n, cls) {
    var on = Math.round(pct * n), h = '<div class="pins ' + (cls || "") + '" role="img" aria-label="' + Math.round(pct * 100) + ' percent mastered">';
    for (var i = 0; i < n; i++) h += '<i class="' + (i < on ? "on" : "") + '"></i>';
    return h + "</div>";
  }
  function record(q, ok) { var r = S.q[q.id] || { r: 0, w: 0 }; if (ok) r.r++; else r.w++; r.last = ok ? 1 : 0; S.q[q.id] = r; save(); }

  var V = { name: "home" }, timer = null, app = document.getElementById("app");
  function go(v) { if (timer) { clearInterval(timer); timer = null; } V = v; render(); window.scrollTo(0, 0); var h = app.querySelector("h1,h2"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } }

  // ---------- views ----------
  function home() {
    var done = 0, total = 0, missed = 0;
    OPEN.forEach(function (c) { var s = stats(c); done += s.done; total += s.total; missed += s.missed; });
    var pct = total ? done / total : 0;
    var h = '<div class="gap-l"><section class="board"><h1>IT Essentials 8 study bench</h1>' +
      "<p>Flashcards and exam-style questions for each chapter, with the reason behind every answer. Your progress is saved on this device.</p>" +
      '<div class="read"><span>Mastered so far</span><b>' + Math.round(pct * 100) + "%</b></div>" + pins(pct, 32, "big") + "</section>" +
      '<div class="row"><button class="btn" data-a="examsetup">Set up a mixed exam</button>' +
      (missed ? '<button class="btn ghost" data-a="missed" data-n="0">Review ' + missed + " missed question" + (missed === 1 ? "" : "s") + "</button>" : "") + "</div>" +
      '<section><h2>Chapters</h2><ul class="slots">';
    CHAPTERS.forEach(function (c) {
      if (c.open) {
        var s = stats(c);
        h += '<li><button class="slot" data-a="chapter" data-n="' + c.n + '"><span class="num">' + two(c.n) + '</span><span class="t">' + esc(c.title) + "</span>" +
          '<span class="meta">' + pins(s.pct, 20) + '<span class="small muted">' + s.done + " of " + s.total + "</span></span></button></li>";
      } else {
        h += '<li><div class="slot off"><span class="num">' + two(c.n) + '</span><span class="t">' + esc(c.title) + '</span><span class="small muted">Added after this chapter is taught</span></div></li>';
      }
    });
    return h + "</ul></section></div>";
  }

  function chapter(n) {
    var c = chap(n), s = stats(c), topics = {};
    c.q.forEach(function (q) { var t = topics[q.topic] || (topics[q.topic] = { r: 0, n: 0 }); t.n++; if (qRight(q)) t.r++; });
    var h = '<div class="stack"><button class="link" data-a="home">Back to all chapters</button>' +
      '<p class="num" style="font-size:1.1rem;color:var(--accent)">Chapter ' + c.n + "</p><h1>" + esc(c.title) + '</h1><p class="muted">' + esc(c.blurb) + "</p>" +
      '<div class="row" style="align-items:center">' + pins(s.pct, 24, "wide") + '<span class="small muted">' + s.done + " of " + s.total + " mastered</span></div>" +
      '<div><button class="mode" data-a="cards" data-n="' + n + '"><b>Flashcards</b><span class="muted">' + c.cards.length + " terms. Flip each one, then mark whether you know it. " + s.known + " known so far.</span></button>" +
      '<button class="mode" data-a="practice" data-n="' + n + '"><b>Practice questions</b><span class="muted">Ten at a time. You see the reason straight after each answer.</span></button>' +
      '<button class="mode" data-a="test" data-n="' + n + '"><b>Chapter test</b><span class="muted">Twenty questions against the clock. Answers and reasons at the end.</span></button>' +
      (s.missed ? '<button class="mode" data-a="missed" data-n="' + n + '"><b>Missed questions</b><span class="muted">' + s.missed + " you got wrong last time. Clear them here.</span></button>" : "") + "</div>" +
      '<section><h2 style="margin-top:1.5rem">Questions answered correctly, by topic</h2><div style="margin-top:.8rem">';
    Object.keys(topics).forEach(function (t) {
      h += '<div class="topic"><span>' + esc(t) + '</span><span class="muted small">' + topics[t].r + " of " + topics[t].n + '</span><div class="bar"><span style="width:' + (100 * topics[t].r / topics[t].n) + '%"></span></div></div>';
    });
    return h + '</div></section><button class="link small" data-a="reset" data-n="' + n + '">Clear my progress for this chapter</button></div>';
  }

  function examSetup() {
    var h = '<div class="stack"><button class="link" data-a="home">Back to all chapters</button><h1>Set up a mixed exam</h1>' +
      '<p class="muted">Questions are drawn at random from the chapters you tick. You get one minute per question, and the answers and reasons appear at the end.</p><div>';
    OPEN.forEach(function (c) { h += '<label class="pick"><input type="checkbox" name="ch" value="' + c.n + '" checked><span><b>Chapter ' + c.n + "</b><br>" + esc(c.title) + "</span></label>"; });
    h += '</div><p><label for="count"><b>Number of questions</b></label><br><select id="count"><option>10</option><option selected>20</option><option>30</option><option>40</option></select></p>' +
      '<p id="setuperr" class="verdict-no" role="alert"></p><button class="btn" data-a="examstart">Start the exam</button></div>';
    return h;
  }

  function makeItems(qs) { return qs.map(function (q) { return { q: q, opts: shuffle(q.opts), pick: null }; }); }
  function startSession(mode, qs, label, back, secs) {
    if (!qs.length) { go(back); return; }
    go({ name: "quiz", mode: mode, items: makeItems(qs), i: 0, label: label, back: back, secs: secs || 0, start: Date.now() });
  }
  function pickPractice(c, n) {
    var unseen = shuffle(c.q.filter(function (q) { return !S.q[q.id]; })), wrong = shuffle(c.q.filter(qMissed)), right = shuffle(c.q.filter(qRight));
    return shuffle(wrong.concat(unseen, right).slice(0, n));
  }

  function quiz() {
    var it = V.items[V.i], n = V.items.length, instant = V.mode === "practice" || V.mode === "missed", answered = it.pick !== null;
    var h = '<div class="top"><span class="muted">' + esc(V.label) + '</span><span>' + (V.secs ? '<span class="clock" id="clock" aria-live="off"></span>' : "") + "</span></div>" +
      '<div class="prog" aria-hidden="true"><span style="width:' + (100 * (V.i + (answered ? 1 : 0)) / n) + '%"></span></div>' +
      '<p class="muted small">Question ' + (V.i + 1) + " of " + n + ", " + esc(it.q.topic) + (OPEN.length > 1 && V.mode === "exam" ? ", chapter " + it.q.ch : "") + "</p>" +
      "<h2>" + esc(it.q.text) + '</h2><ul class="opts">';
    it.opts.forEach(function (o, k) {
      var cls = "opt", dis = "";
      if (instant && answered) { dis = " disabled"; if (o === it.q.opts[0]) cls += " right"; else if (o === it.pick) cls += " wrong"; }
      else if (o === it.pick) cls += " sel";
      h += '<li><button class="' + cls + '" data-a="pick" data-k="' + k + '"' + dis + ' aria-pressed="' + (o === it.pick) + '"><span class="k">' + "ABCD"[k] + "</span><span>" + esc(o) + "</span></button></li>";
    });
    h += "</ul>";
    if (instant && answered) {
      var ok = it.pick === it.q.opts[0];
      h += '<div class="why" role="status"><b class="' + (ok ? "verdict-ok" : "verdict-no") + '">' + (ok ? "Correct." : "Not quite. The answer is: " + esc(it.q.opts[0])) + "</b>" + esc(it.q.why) + "</div>";
    }
    h += '<div class="row" style="margin-top:1.4rem">';
    if (instant) h += '<button class="btn" data-a="next"' + (answered ? "" : " disabled") + ">" + (V.i === n - 1 ? "See my results" : "Next question") + "</button>";
    else {
      if (V.i > 0) h += '<button class="btn ghost" data-a="prev">Previous</button>';
      h += V.i === n - 1 ? '<button class="btn gold" data-a="finish">Finish and mark</button>' : '<button class="btn" data-a="next">Next question</button>';
    }
    return h + '<button class="link" data-a="quit" style="margin-left:auto">Leave</button></div>';
  }
  function tick() {
    var el = document.getElementById("clock"); if (!el) return;
    var left = V.secs - Math.floor((Date.now() - V.start) / 1000);
    if (left <= 0) { finish(); return; }
    el.textContent = Math.floor(left / 60) + ":" + two(left % 60) + " left"; el.className = "clock" + (left <= 60 ? " low" : "");
  }
  function finish() {
    var instant = V.mode === "practice" || V.mode === "missed";
    if (!instant) V.items.forEach(function (it) { record(it.q, it.pick === it.q.opts[0]); });
    go({ name: "results", items: V.items, label: V.label, back: V.back, mode: V.mode, took: Math.round((Date.now() - V.start) / 1000) });
  }

  function results() {
    var n = V.items.length, right = V.items.filter(function (it) { return it.pick === it.q.opts[0]; }).length, pct = Math.round(100 * right / n);
    var wrong = V.items.filter(function (it) { return it.pick !== it.q.opts[0]; }), topics = {};
    V.items.forEach(function (it) { var t = topics[it.q.topic] || (topics[it.q.topic] = { r: 0, n: 0 }); t.n++; if (it.pick === it.q.opts[0]) t.r++; });
    var graded = V.mode === "test" || V.mode === "exam";
    var h = '<div class="stack"><p class="muted">' + esc(V.label) + '</p><h1 class="score">' + right + '<span style="font-size:.45em"> of ' + n + "</span></h1>" +
      "<p><b>" + pct + "%.</b> " + (graded ? (pct >= TARGET ? "That is at or above the " + TARGET + "% target." : "That is below the " + TARGET + "% target. Read the reasons below, then try again.") : (wrong.length ? "Read the reasons for the ones you missed, then run them again." : "Every one correct.")) +
      (graded ? ' <span class="muted">Time taken: ' + Math.floor(V.took / 60) + " min " + (V.took % 60) + " s.</span>" : "") + "</p>" +
      '<div class="row">' + (wrong.length ? '<button class="btn" data-a="retry">Retry the ' + wrong.length + " I missed</button>" : "") + '<button class="btn ghost" data-a="back">Done</button></div>' +
      '<section><h2 style="margin-top:1.2rem">By topic</h2><div style="margin-top:.6rem">';
    Object.keys(topics).forEach(function (t) { h += '<div class="topic"><span>' + esc(t) + '</span><span class="muted small">' + topics[t].r + " of " + topics[t].n + '</span><div class="bar"><span style="width:' + (100 * topics[t].r / topics[t].n) + '%"></span></div></div>'; });
    h += '</div></section><section><h2 style="margin-top:1.5rem">Every question, with the reason</h2>';
    wrong.concat(V.items.filter(function (it) { return it.pick === it.q.opts[0]; })).forEach(function (it) {
      var ok = it.pick === it.q.opts[0];
      h += '<div class="rev"><span class="tag' + (ok ? "" : " no") + '">' + (ok ? "Correct" : it.pick === null ? "Not answered" : "Missed") + '</span><p class="q" style="margin-top:.4rem">' + esc(it.q.text) + "</p>" +
        (!ok && it.pick !== null ? '<p class="a muted">You chose: ' + esc(it.pick) + "</p>" : "") + '<p class="a"><b>Answer:</b> ' + esc(it.q.opts[0]) + '</p><p class="a muted">' + esc(it.q.why) + "</p></div>";
    });
    return h + "</section></div>";
  }

  function startCards(n, onlyLearning) {
    var c = chap(n), pool = c.cards.filter(function (k) { return S.c[k.id] !== 1; });
    if (!onlyLearning && !pool.length) pool = c.cards;
    if (!pool.length) { go({ name: "chapter", n: n }); return; }
    go({ name: "cards", n: n, deck: shuffle(pool), i: 0, flip: false, got: 0 });
  }
  function cards() {
    var c = chap(V.n);
    if (V.i >= V.deck.length) {
      var left = c.cards.filter(function (k) { return S.c[k.id] !== 1; }).length;
      return '<div class="stack"><h1>Deck finished</h1><p>You marked ' + V.got + " of " + V.deck.length + " as known this round. " + (left ? left + " still to learn in this chapter." : "You know every term in this chapter.") + "</p>" +
        '<div class="row">' + (left ? '<button class="btn" data-a="cardsagain">Go again with the ' + left + " still to learn</button>" : '<button class="btn" data-a="cardsall">Go through all of them again</button>') +
        '<button class="btn ghost" data-a="chapter" data-n="' + V.n + '">Back to chapter ' + V.n + "</button></div></div>";
    }
    var k = V.deck[V.i];
    return '<div class="top"><span class="muted">Chapter ' + V.n + " flashcards</span><span class=\"muted small\">Card " + (V.i + 1) + " of " + V.deck.length + "</span></div>" +
      '<div class="prog" aria-hidden="true"><span style="width:' + (100 * V.i / V.deck.length) + '%"></span></div>' +
      '<button class="card" data-a="flip" aria-live="polite"><span class="term">' + esc(k.term) + "</span>" + (V.flip ? '<span class="def">' + esc(k.def) + "</span>" : '<span class="hint muted small">Say what it means, then tap to check.</span>') + "</button>" +
      '<div class="row" style="margin-top:1.2rem">' + (V.flip ? '<button class="btn ghost" data-a="learn">Still learning</button><button class="btn" data-a="know">I know this</button>' : '<button class="btn" data-a="flip">Show the meaning</button>') +
      '<button class="link" data-a="chapter" data-n="' + V.n + '" style="margin-left:auto">Leave</button></div>';
  }

  function render() {
    var v = V.name;
    app.innerHTML = '<div class="wrap">' + (v === "home" ? home() : v === "chapter" ? chapter(V.n) : v === "examsetup" ? examSetup() : v === "quiz" ? quiz() : v === "results" ? results() : cards()) + "</div>";
    if (v === "quiz" && V.secs) { tick(); if (!timer) timer = setInterval(tick, 1000); }
  }

  // ---------- actions ----------
  function act(a, el) {
    var n = el && el.getAttribute("data-n") ? +el.getAttribute("data-n") : 0, c, it;
    if (a === "home") go({ name: "home" });
    else if (a === "chapter") go({ name: "chapter", n: n });
    else if (a === "examsetup") go({ name: "examsetup" });
    else if (a === "cards") startCards(n, false);
    else if (a === "cardsagain") startCards(V.n, true);
    else if (a === "cardsall") { chap(V.n).cards.forEach(function (k) { delete S.c[k.id]; }); save(); startCards(V.n, false); }
    else if (a === "flip") { V.flip = !V.flip; render(); var b = app.querySelector(".card"); if (b) b.focus(); }
    else if (a === "know" || a === "learn") { S.c[V.deck[V.i].id] = a === "know" ? 1 : 0; if (a === "know") V.got++; save(); V.i++; V.flip = false; render(); var f = app.querySelector(".card,h1"); if (f) { f.setAttribute("tabindex", "-1"); f.focus(); } }
    else if (a === "practice") { c = chap(n); startSession("practice", pickPractice(c, 10), "Chapter " + n + " practice", { name: "chapter", n: n }); }
    else if (a === "test") { c = chap(n); var qs = shuffle(c.q).slice(0, 20); startSession("test", qs, "Chapter " + n + " test", { name: "chapter", n: n }, qs.length * 60); }
    else if (a === "missed") { var pool = []; (n ? [chap(n)] : OPEN).forEach(function (x) { pool = pool.concat(x.q.filter(qMissed)); }); startSession("missed", shuffle(pool), "Missed questions", n ? { name: "chapter", n: n } : { name: "home" }); }
    else if (a === "examstart") {
      var picked = [].slice.call(document.querySelectorAll('input[name="ch"]:checked')).map(function (i) { return +i.value; });
      if (!picked.length) { document.getElementById("setuperr").textContent = "Tick at least one chapter to draw questions from."; return; }
      var all = []; picked.forEach(function (p) { all = all.concat(chap(p).q); });
      var count = Math.min(+document.getElementById("count").value, all.length), set = shuffle(all).slice(0, count);
      startSession("exam", set, "Mixed exam, " + count + " questions", { name: "home" }, count * 60);
    }
    else if (a === "pick") {
      it = V.items[V.i]; var instant = V.mode === "practice" || V.mode === "missed";
      if (instant && it.pick !== null) return;
      it.pick = it.opts[+el.getAttribute("data-k")];
      if (instant) record(it.q, it.pick === it.q.opts[0]);
      render(); var nx = app.querySelector(instant ? '[data-a="next"]' : ".opt.sel"); if (nx) nx.focus();
    }
    else if (a === "next") { if (V.i < V.items.length - 1) { V.i++; render(); window.scrollTo(0, 0); var h2 = app.querySelector("h2"); if (h2) { h2.setAttribute("tabindex", "-1"); h2.focus({ preventScroll: true }); } } else finish(); }
    else if (a === "prev") { V.i--; render(); }
    else if (a === "finish") { var blank = V.items.filter(function (x) { return x.pick === null; }).length; if (blank && !el.getAttribute("data-sure")) { el.setAttribute("data-sure", "1"); el.textContent = blank + " not answered. Finish anyway"; return; } finish(); }
    else if (a === "quit") go(V.back);
    else if (a === "back") go(V.back);
    else if (a === "retry") { var w = V.items.filter(function (x) { return x.pick !== x.q.opts[0]; }).map(function (x) { return x.q; }); startSession("missed", shuffle(w), "Missed questions", V.back); }
    else if (a === "reset") { if (!el.getAttribute("data-sure")) { el.setAttribute("data-sure", "1"); el.textContent = "Tap again to clear this chapter's progress"; return; } c = chap(n); c.q.forEach(function (q) { delete S.q[q.id]; }); c.cards.forEach(function (k) { delete S.c[k.id]; }); save(); render(); }
  }
  document.addEventListener("click", function (e) { var el = e.target.closest ? e.target.closest("[data-a]") : null; if (el && !el.disabled) act(el.getAttribute("data-a"), el); });
  document.addEventListener("keydown", function (e) {
    if (V.name !== "quiz" || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = "abcd".indexOf(e.key.toLowerCase()); if (k < 0) k = "1234".indexOf(e.key);
    if (k >= 0 && k < V.items[V.i].opts.length) { var b = app.querySelectorAll(".opt")[k]; if (b && !b.disabled) act("pick", b); }
  });
  render();
})();
</script>
