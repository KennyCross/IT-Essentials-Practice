  ["T568A", "White/green, green, white/orange, blue, white/blue, orange, white/brown, brown."],
  ["T568B", "White/orange, orange, white/green, blue, white/blue, green, white/brown, brown."],
  ["SMF and MMF", "Single-mode: small core, laser, long distance. Multimode: larger core, LEDs, cheaper."],
  ["ST, SC and LC", "Fiber-optic connectors."],
  ]
},

{ n: 6, title: "Applied Networking", open: true,
  blurb: "MAC, IPv4 and IPv6 addressing, configuring a NIC and a wireless router, firewall settings, IoT, and network troubleshooting.",
  q: [
  ["Addressing", "When a laptop is moved to a different network, what happens to its addresses?", ["The MAC address stays the same, but the IPv4 and IPv6 addresses change", "The MAC address changes, but the IP addresses stay the same", "All of its addresses change", "None of its addresses change"], "A MAC address is part of the NIC. IP addresses are assigned by the company or internet provider."],
  ["Addressing", "Which command and switch shows the MAC (physical) address on a Windows computer?", ["ipconfig /all", "ipconfig /release", "ping -t", "nslookup"], "ipconfig /all also shows the DHCP and DNS servers."],
  ["Addressing", "How long is a MAC address?", ["48 bits", "32 bits", "64 bits", "128 bits"], "It is written as 12 hexadecimal characters. IPv4 is 32 bits and IPv6 is 128 bits."],
  ["Addressing", "What determines which part of an IPv4 address is the network part?", ["The subnet mask", "The default gateway", "The DNS server", "The MAC address"], "An IPv4 address has a network part and a host part."],
  ["Addressing", "For the address 192.168.200.8 with subnet mask 255.255.255.0, what is the host portion?", ["8", "192", "192.168", "200.8"], "The mask marks the first three numbers as network, leaving 8 as the host."],
  ["Addressing", "How long is an IPv6 address?", ["128 bits", "32 bits", "48 bits", "64 bits"], "It is written as eight groups of four hexadecimal characters."],
  ["Addressing", "Which is the correctly compressed form of 2001:0DB8:0000:1111:0000:0000:0000:0200?", ["2001:DB8:0:1111::200", "2001:DB8::1111::2", "2001:DB8:0:1111:0:0:0:2", "21:DB8:0:1111::200"], "Omit leading 0s and replace one run of all-0 segments with a double colon. Trailing 0s are kept."],
  ["Addressing", "In IPv6 compression, how many times may the double colon (::) be used in one address?", ["Once", "Twice", "As often as needed", "Never"], "Used more than once, nobody could tell how many groups each stood for."],
  ["Addressing", "Which four items are needed in a static configuration to communicate with other networks and the internet?", ["IP address, subnet mask, default gateway, DNS server", "MAC address, SSID, channel, passphrase", "Port, protocol, scope, lease", "Host name, domain, workgroup, user"], "The gateway is the router's address. The DNS server converts names to IP addresses."],
  ["Addressing", "What is the default gateway?", ["The address of the router, so information can be sent to other networks", "The address of the DNS server", "The first address in the DHCP scope", "The MAC address of the switch"], "Without it, a device can reach its own network but not others."],
  ["Addressing", "Where does a device get its IP addressing with dynamic addressing?", ["From a DHCP server", "From the DNS server", "From the NIC manufacturer", "From the subnet mask"], "In Windows the setting is to obtain an IP address automatically."],
  ["Addressing", "A Windows computer has the IPv4 address 169.254.20.7. What does this mean?", ["It could not obtain an IPv4 address, so it is using a link-local address", "It has a static address", "It is connected to a VPN", "It is the DHCP server"], "A device uses a link-local IPv4 address if it cannot obtain one from a DHCP server."],
  ["Addressing", "What is true of IPv6 link-local addresses?", ["An IPv6 device must always have one", "They appear only when DHCP fails", "They begin with 169.254", "They are routed across the internet"], "They begin with fe80 and are normal, not a sign of a fault."],
  ["DNS records", "Which DNS record resolves a domain name to an IPv4 address?", ["A", "AAAA", "MX", "TXT"], "AAAA resolves a name to an IPv6 address."],
  ["DNS records", "Which DNS record identifies the email servers that accept mail for a domain?", ["MX", "A", "AAAA", "TXT"], "Mail Exchange records include a priority value. The lowest integer is preferred."],
  ["DNS records", "Where does a DNS server store its list of resource records?", ["In a DNS zone database", "In the MAC address table", "In the DHCP scope", "In the CMOS chip"], "If it finds no match there, it queries a higher-level DNS server."],
  ["NIC", "Where in Windows do you view or update a NIC's driver?", ["Device Manager, under Network adapters", "Disk Management", "Task Scheduler", "Windows Defender"], "Right-click the NIC and choose Properties or Update driver."],
  ["NIC", "What is ICMP used for?", ["Testing connectivity and sending control and error messages", "Assigning IP addresses", "Encrypting wireless traffic", "Translating domain names"], "The ping command is part of ICMP."],
  ["NIC", "What should you check when installing a wireless NIC?", ["That the antenna is positioned for optimum reachability", "That the SATA cable is connected", "That the CMOS battery is new", "That the monitor is in native mode"], "A poorly placed antenna weakens the signal."],
  ["Router setup", "When connecting a home network, where does the cable from the broadband modem go?", ["To the wireless router's internet port", "To one of the router's switch ports", "Directly to the PC", "To the printer"], "Devices connect to the switch ports. The modem connects to the internet port."],
  ["Router setup", "What should you change immediately after first logging in to a wireless router?", ["The default username and password", "The cable category", "The MAC address", "The subnet mask of the modem"], "Default credentials are widely known."],
  ["Router setup", "After changing a router's DHCP range, which commands renew the address on a Windows PC?", ["ipconfig /release then ipconfig /renew", "ping -t then ping -n", "nslookup then tracert", "ipconfig /all then ipconfig /flushdns"], "The first gives up the old lease. The second requests a new one."],
  ["Router setup", "Which of these is a basic wireless setting you configure on a router?", ["The SSID", "The MX record", "The voltage selector", "The boot order"], "The basic wireless settings are network mode, SSID, channel, security mode and passphrase."],
  ["Router setup", "What does NAT do?", ["Converts private IPv4 addresses to internet-routable public IPv4 addresses", "Prioritizes specific traffic types", "Blocks known web sites", "Assigns MAC addresses"], "It lets many internal devices share one public address."],
  ["Router setup", "What does Quality of Service (QoS) configuration allow?", ["Prioritization of specific traffic types", "Automatic opening of ports", "Translation of domain names", "Extension of the wireless range"], "Time-sensitive traffic such as voice and video can go first."],
  ["Firewall settings", "What does the course say about UPnP?", ["It is not secure and is a security risk", "It is the most secure setting", "It encrypts wireless traffic", "It blocks all inbound ports"], "UPnP lets devices add themselves to a network and open ports without configuration."],
  ["Firewall settings", "What is a DMZ?", ["A network that provides services to an untrusted network", "A list of blocked web sites", "A wireless security mode", "A type of IP address"], "A DMZ often contains servers."],
  ["Firewall settings", "What is the difference between port forwarding and port triggering?", ["Forwarding allows traffic to specific ports. Triggering opens a temporary opening for an application or game", "Forwarding is for IPv6. Triggering is for IPv4", "Forwarding blocks ports. Triggering opens them permanently", "There is no difference"], "A triggered opening closes again afterwards."],
  ["Firewall settings", "What does MAC address filtering specify?", ["The MAC addresses that are allowed on the wireless network", "The ports that are forwarded", "The web sites that are blocked", "The DHCP address range"], "Each permitted device's MAC address is entered in the filter list."],
  ["Firewall settings", "Which allows users access to specific IP addresses only?", ["Whitelisting", "Blacklisting", "UPnP", "Port triggering"], "Blacklisting blocks known web sites and allows everything else."],
  ["Troubleshooting", "All devices on a network have a problem. Where does the course say to start?", ["In the network room where all the devices are connected", "At the newest PC", "At the printer", "At the furthest wireless device"], "If only one device has the problem, start with that device."],
  ["Troubleshooting", "Which is a common cause of network problems listed in step 2?", ["Loose cable connections", "A drained CMOS battery", "A missing thermal compound", "A wrong display resolution"], "Others are an improperly installed NIC, ISP down, low wireless signal, invalid IP address, and DNS or DHCP server issues."],
  ["Troubleshooting", "NIC LED lights are not lit. What is a probable cause?", ["The network cable is unplugged or damaged", "The DNS server is down", "The default gateway is wrong", "The SSID is hidden"], "Reconnect or replace the cable. If the NIC is damaged, replace it."],
  ["Troubleshooting", "A device can connect to a network device by IP address but not by host name. What is a probable cause?", ["Incorrect DNS settings", "A damaged network cable", "A failed NIC", "Low wireless signal"], "Other causes are an incorrect host name or a DNS server that is not operational."],
  ["Troubleshooting", "A user cannot access the FTP server because a firewall is blocking it. Which ports must be allowed?", ["20 and 21", "80 and 443", "25 and 110", "67 and 68"], "Check both the router's firewall and the Windows firewall."],
  ["Troubleshooting", "A device on one network cannot ping a device on another. Which command locates the broken link?", ["tracert", "ipconfig /all", "nslookup", "ipconfig /renew"], "tracert shows the path and where it stops."],
  ["Troubleshooting", "ipconfig /renew reports that the operation failed because no adapter is in the state permissible. What is the cause?", ["The computer is configured with a static IP address", "The DNS server is down", "The SSID is hidden", "The router has no power"], "Reconfigure the NIC to obtain an IP address automatically."],
  ["Troubleshooting", "Which commands does step 5 name for verifying a network fix?", ["ipconfig /all and ping", "format and chkdsk", "sfc and dism", "defrag and cleanmgr"], "Also verify the device can access authorized resources such as email servers and the internet."],
  ],
  cards: [
  ["MAC address", "A unique 48-bit number that is part of the NIC. Written as 12 hexadecimal characters."],
  ["OUI", "The first half of a MAC address, identifying the manufacturer."],
  ["IPv4 address", "32 bits, written as four decimal numbers separated by dots. Has a network part and a host part."],
  ["Subnet mask", "Determines which part of an IPv4 address is the network part."],
  ["IPv6 address", "128 bits, written as eight groups of four hexadecimal characters separated by colons."],
  ["IPv6 compression rules", "Omit leading 0s. Replace one run of all-0 segments with a double colon."],
  ["ipconfig /all", "Shows full IP addressing, including the MAC (physical) address."],
  ["Static addressing", "IP address, subnet mask, default gateway and DNS server entered manually."],
  ["Dynamic addressing", "IP addressing information supplied by a DHCP server."],
  ["Default gateway", "The address of the router, so information can be sent to other networks."],
  ["DNS server setting", "The server that converts domain names or URLs to IP addresses."],
  ["A and AAAA records", "A resolves a name to an IPv4 address. AAAA resolves a name to an IPv6 address."],
  ["MX record", "Identifies the email servers for a domain. The lowest priority value is preferred."],
  ["TXT record", "Textual information about a host, server or network. Used to identify legitimate email servers."],
  ["DNS zone database", "Where a DNS server stores its resource records."],
  ["Link-local IPv4 address", "169.254.x.x. Used when a device cannot obtain an IPv4 address."],
  ["Link-local IPv6 address", "Begins with fe80. An IPv6 device must always have one."],
  ["ICMP", "Internet Control Message Protocol. Tests connectivity and sends control and error messages."],
  ["ping", "A command that is part of ICMP. Tests whether a device can be reached."],
  ["ipconfig /release and /renew", "Give up the current DHCP address, then request a new one."],
  ["tracert", "Shows the path to a destination, to locate a broken link."],
  ["nslookup", "Queries a DNS server directly, to test name resolution."],
  ["SSID", "The name of a wireless network."],
  ["Basic wireless settings", "Network mode, SSID, channel, security mode, passphrase."],
  ["Wireless mesh network", "Access points connected together to extend wireless coverage."],
  ["NAT", "Converts private IPv4 addresses to internet-routable public IPv4 addresses."],
  ["QoS", "Quality of Service. Prioritizes specific traffic types."],
  ["UPnP", "Lets devices add themselves to a network without configuration. Not secure."],
  ["DMZ", "A network that provides services to an untrusted network. Often contains servers."],
  ["Port forwarding", "Allows traffic to specific ports."],
  ["Port triggering", "A temporary opening in the firewall for an application or game."],
  ["MAC address filtering", "Specifies the MAC addresses that are allowed on the wireless network."],
  ["Whitelist and blacklist", "A whitelist allows access to specific addresses only. A blacklist blocks known web sites."],
  ["IoT", "Internet of Things. Everyday devices connected to a network, as in a smart home."],
  ["One device or all devices?", "One device: start with that device. All devices: start in the network room."],
  ["Common network causes", "Loose cables, improperly installed NIC, ISP down, low wireless signal, invalid IP address, DNS or DHCP server issue."],
  ]
},
 { n: 7, title: "Laptops and Other Mobile Devices", open: true,
  blurb: "Mobile device types, laptop components and displays, power and wireless settings, replacing parts, email and sync, maintenance and troubleshooting.",
  q: [
  ["Devices", "Which is a feature of mobile devices listed in the course?", ["They have self-contained power in the form of rechargeable batteries", "They rely on connected peripheral devices to operate", "They must be plugged into an outlet to run", "They use standard ATX motherboards"], "Mobile devices have their own power, are generally small and lightweight, and do not rely on other connected peripherals."],
  ["Devices", "What usually distinguishes a laptop from other mobile devices?", ["It runs a full version of an operating system", "It can only run apps from a store", "It has a black and white display", "It only monitors physical activity"], "Laptops usually run full versions of operating systems such as Windows, macOS or Linux."],
  ["Devices", "Which connectivity do smartphones use for voice, text and data services?", ["Cellular", "Infrared", "Ethernet", "FireWire"], "Other data connections on a smartphone include Bluetooth and Wi-Fi."],
  ["Devices", "How can a device without GPS still determine its location, less precisely?", ["From nearby mobile service antennas or Wi-Fi access points", "From its Bluetooth PIN", "From its MAC address alone", "From the SD card"], "A GPS receiver uses satellites. Without one, cell towers and Wi-Fi access points give an approximate location."],
  ["Devices", "What is true of most tablets?", ["They cannot access cellular networks and usually have no GPS receiver", "They run full desktop operating systems only", "They have black and white displays", "They have no Wi-Fi"], "Tablets use mobile operating systems, usually with Wi-Fi and Bluetooth, and larger touch screens than phones."],
  ["Devices", "Which device has a black and white display optimized for reading text, with long battery life?", ["E-reader", "Tablet", "Smartwatch", "Smartphone"], "E-readers resemble tablets but lack many of their features."],
  ["Devices", "How does a fitness tracker differ from a smartwatch?", ["It is limited to monitoring the body, such as activity, sleep and exercise", "It has a full operating system and apps", "It connects directly to cellular networks", "It displays immersive 3D graphics"], "A smartwatch has a microprocessor, a special operating system and apps."],
  ["Devices", "Which technology integrates computer graphics with what is seen in the real world?", ["Augmented reality", "Virtual reality", "Near field communication", "Infrared"], "Virtual reality uses a headset to display immersive 3D graphics that replace the real view."],
  ["Laptop components", "What is true of laptop motherboards?", ["They vary by manufacturer and are proprietary", "They use the standard ATX form factor", "They fit any laptop case", "They use DIMM slots"], "Desktop motherboards have standard form factors. Laptop motherboards do not."],
  ["Laptop components", "Which memory module do laptops use?", ["SODIMM", "DIMM", "SIMM", "DIP"], "Small Outline Dual In-line Memory Modules."],
  ["Laptop components", "What is the purpose of the Fn key?", ["To activate a second function on a dual-purpose key", "To switch the laptop off", "To open the BIOS", "To eject the battery"], "Examples include dual displays, volume, brightness, and turning Wi-Fi or the touchpad on or off."],
  ["Laptop components", "How does a port replicator usually connect to a laptop?", ["Through a USB or Thunderbolt connection", "Through a proprietary docking connector", "Through the RAM slot", "Through the SIM tray"], "A docking station uses proprietary connectors."],
  ["Displays", "Which technologies do laptop LCD displays commonly use?", ["Twisted Nematic (TN) or In-Plane Switching (IPS)", "CCFL or OLED", "PGA or LGA", "POP3 or IMAP"], "LED displays use less power and last longer than LCD. OLED is common on mobile devices and cameras."],
  ["Displays", "What is the special glass on the front of a touch screen called?", ["A digitizer", "An inverter", "A backlight", "A cutoff switch"], "The digitizer senses touch."],
  ["Displays", "What does a cutoff switch do?", ["Helps conserve power by turning off the display", "Converts DC to AC", "Connects the Wi-Fi antenna", "Detaches the screen"], "It acts when the lid is closed."],
  ["Displays", "Which component is needed by a cold cathode fluorescent lamp (CCFL) backlight?", ["An inverter", "A digitizer", "A SIM card", "A port replicator"], "LED backlights are the other common type."],
  ["Displays", "Where are Wi-Fi antennas typically located in a laptop?", ["Above the screen", "Under the keyboard", "Inside the battery", "Beside the touchpad"], "They connect to the wireless card by antenna wire and leads, held by wire guides at the sides of the screen."],
  ["Power", "What does ACPI do?", ["Creates a bridge between the hardware and the operating system for power management", "Encrypts wireless traffic", "Pairs Bluetooth devices", "Synchronizes email folders"], "Advanced Configuration and Power Interface."],
  ["Power", "Which ACPI state is known as hibernate mode, or \"save to disk\"?", ["S4", "S3", "S1", "S5"], "In S4 the CPU and RAM are off and the contents of RAM are saved to a temporary file on the hard disk."],
  ["Power", "Which ACPI state is known as suspend mode, or \"save to RAM\"?", ["S3", "S4", "S0", "S2"], "In S3 the CPU is off and the RAM is set to a slow refresh rate."],
  ["Power", "In which ACPI state is the computer on with the CPU running?", ["S0", "S1", "S3", "S5"], "S5 is off."],
  ["Power", "Where must ACPI power management be enabled so the OS can configure the power states?", ["In the BIOS or UEFI", "In the email client", "On the SIM card", "In the Bluetooth Wizard"], "BIOS power settings also affect thermal management and Wake on LAN."],
  ["Wireless", "What is the approximate range of the most common Bluetooth technology?", ["33 ft (10 m)", "3 ft (1 m)", "330 ft (100 m)", "1 mile (1.6 km)"], "The distance of a Bluetooth PAN is limited by the power used by its devices."],
  ["Wireless", "What is authenticating a Bluetooth device with a PIN the first time it connects called?", ["Pairing", "Tethering", "Synchronizing", "Flashing"], "Bluetooth supports 128-bit encryption and PIN authentication."],
  ["Wireless", "Which laptop wireless card supports only 802.11a, 802.11b and 802.11g?", ["Mini-PCI", "Mini-PCIe", "PCI Express Micro", "ExpressCard/54"], "Mini-PCIe and PCI Express Micro also support 802.11n and 802.11ac."],
  ["Wireless", "When a cell phone lets Wi-Fi devices use its mobile data network, what is it called?", ["A hotspot", "A docking station", "A port replicator", "A smart card"], "Tethering can be made by Wi-Fi, Bluetooth or USB cable."],
  ["Hardware", "Which are the dimensions of an ExpressCard/34?", ["75 mm x 34 mm", "75 mm x 54 mm", "34 mm x 34 mm", "54 mm x 34 mm"], "The ExpressCard/54 is 75 mm x 54 mm. Both are 5 mm thick."],
  ["Hardware", "Which type of smart card reader works when the card comes close to it?", ["Contactless", "Contact", "Magnetic", "Infrared"], "A contact reader needs the card to be inserted."],
  ["Hardware", "Which parts are examples of customer-replaceable units (CRUs)?", ["The laptop battery and RAM", "The motherboard and LCD display", "The keyboard and motherboard", "The LCD display and DC jack"], "The motherboard, LCD display and keyboard are field-replaceable units (FRUs)."],
  ["Hardware", "Which is a sign that a laptop battery may need to be replaced?", ["The battery does not hold a charge", "The Num Lock key is on", "The display is in native mode", "The Wi-Fi switch is off"], "Other signs are a battery that overheats or leaks."],
  ["Hardware", "What must a replacement laptop battery do?", ["Meet or exceed the manufacturer's specifications and use the same form factor", "Have a higher voltage than the original", "Be from a different manufacturer", "Be larger than the original"], "Voltages, power ratings and AC adapters must also meet manufacturer specifications."],
  ["Hardware", "What does a SIM card contain?", ["Information used to authenticate a device to mobile telephone and data providers", "The phone's operating system", "The battery charge level", "The screen's digitizer settings"], "It can also hold contacts and text messages."],
  ["Hardware", "Which cable is used to connect Apple devices to host computers and peripherals?", ["Lightning", "Mini-USB", "Micro-USB", "Molex"], "USB-C can be plugged in either direction and is used on many mobile devices."],
  ["Hardware", "Which wireless connection can control a TV or set top box remotely?", ["Infrared (IR)", "NFC", "Cellular", "GPS"], "NFC needs the devices placed close together or touching."],
  ["Email and sync", "Which email protocol typically does not leave a copy of the email on the server?", ["POP3", "IMAP", "SMTP", "MIME"], "POP3 downloads the mail and disconnects. It uses TCP port 110."],
  ["Email and sync", "Which email protocol synchronizes email folders between the server and client?", ["IMAP", "POP3", "SMTP", "SSL"], "IMAP uses TCP port 143."],
  ["Email and sync", "What does MIME do?", ["Extends email to include formats such as pictures and word processor documents", "Retrieves email from a server", "Encrypts the Wi-Fi connection", "Assigns the email address"], "MIME is normally used with SMTP, which is text-based."],
  ["Email and sync", "What does the Outlook client use to connect to Exchange servers?", ["MAPI", "MIME", "NFC", "ACPI"], "Messaging Application Programming Interface, a proprietary messaging architecture."],
  ["Email and sync", "What does Airplane Mode turn off?", ["All cellular, Wi-Fi and Bluetooth radios", "Only the screen", "Only the GPS receiver", "The battery"], "Most functions remain usable but communication is not possible."],
  ["Email and sync", "Which cellular generation introduced SMS and MMS?", ["2G", "1G", "3G", "4G"], "2G switched from analog to digital standards."],
  ["Email and sync", "What is required to set up an iOS device?", ["An Apple ID", "A Google account", "An Exchange server", "A docking station"], "Android devices prompt for a Google account."],
  ["Email and sync", "On iOS, what must happen before Wi-Fi Sync can be used?", ["The device must first synchronize with iTunes using a USB cable", "Airplane mode must be turned on", "The SIM card must be removed", "Bluetooth must be paired"], "iOS devices can use USB or Wi-Fi Sync with iTunes."],
  ["Maintenance", "What should never be used when cleaning a laptop?", ["Harsh cleaners or solutions that contain ammonia", "A soft, lint-free cloth", "Compressed air", "Cotton swabs"], "Use nonabrasive materials and mild cleaning solutions."],
  ["Maintenance", "Which are the three basic preventive maintenance tasks for mobile devices?", ["Clean, back up, update", "Defragment, format, reinstall", "Disassemble, solder, reassemble", "Pair, tether, sync"], "Clean the device, back up the data, and update the OS and applications."],
  ["Troubleshooting", "Which is a common cause of laptop problems listed in step 2?", ["The Num Lock key is on", "The ISP is down", "The toner is low", "The DNS server is not operational"], "Others are a battery with no charge, loose cables and a loose RAM module."],
  ["Troubleshooting", "A laptop does not power on. Which is a solution from the course table?", ["Plug the laptop into AC power", "Toggle the Num Lock key", "Lower the screen resolution", "Turn on airplane mode"], "Also remove and reinstall the battery, and replace it if it will not charge."],
  ["Troubleshooting", "A mobile device will not connect to the internet because Wi-Fi is not available. What is the solution?", ["Move to within the boundaries of a Wi-Fi network", "Replace the battery", "Remove the SD card", "Clean the speaker"], "If there is no carrier data network in range, move within the boundaries of one."],
  ["Troubleshooting", "Which step 5 check applies to laptops and mobile devices but not desktops?", ["Operate the device using only the battery", "Print a document", "Reboot the device", "Check for error messages"], "For mobile devices, also make a call, send a text and browse by Wi-Fi and the carrier network."],
  ],
  cards: [
  ["Mobility", "The ability to access information electronically from different locations outside the home or office."],

  ["Tablet", "A mobile OS device with a larger touch screen. Most have no cellular access or GPS."],

  ["Smartwatch and fitness tracker", "A smartwatch has an OS and apps. A fitness tracker only monitors the body."],
  ["AR and VR", "AR integrates graphics with the real world. VR shows immersive 3D graphics in a headset."],
  ["Laptop motherboard", "Varies by manufacturer and is proprietary."],
  ["Fn key", "Activates a second function on a dual-purpose key."],
  ["Docking station", "Uses proprietary connectors to turn a laptop into a desktop system."],

  ["TN and IPS", "Twisted Nematic and In-Plane Switching: the technologies commonly used in laptop LCDs."],
  ["OLED", "Organic LED display, common on mobile devices and digital cameras."],
  ["Digitizer", "The special glass on the front of a touch screen."],
  ["Cutoff switch", "Conserves power by turning off the display."],
  ["Inverter", "Converts DC to the AC a CCFL backlight needs."],

  ["S3", "Suspend mode, \"save to RAM\". CPU off, RAM at a slow refresh rate."],

  ["Wake on LAN", "A BIOS power setting that lets a computer be woken over the network."],
  ["Bluetooth pairing", "Authenticating a device with a PIN the first time it connects."],

  ["Mini-PCIe and PCI Express Micro", "Laptop wireless cards that also support 802.11n and 802.11ac."],

}, { n: 8, title: "Printers", open: true,
  blurb: "Printer features and cost of ownership, inkjet, laser, thermal, impact, virtual and 3D printers, the laser process, installing, sharing, maintenance and troubleshooting.",
  q: [
  ["Features", "What is printer speed measured in?", ["Pages per minute (ppm)", "Dots per inch (dpi)", "Mean time between failures (MTBF)", "Megabits per second (Mbps)"], "Speed is measured in ppm. Quality is measured in dpi."],
  ["Features", "What is print quality measured in?", ["Dots per inch (dpi)", "Pages per minute (ppm)", "Hertz (Hz)", "Characters per second"], "The more dots per inch, the sharper the print."],
  ["Features", "What does the K stand for in CMYK?", ["Key, the black ink", "Khaki", "Kelvin", "Kilobyte"], "Color printing uses cyan, magenta and yellow. Black is the base or key color."],
  ["Features", "Which of these is part of a printer's total cost of ownership?", ["The cost of consumable supplies", "The speed in pages per minute", "The resolution in dots per inch", "The colour of the case"], "TCO includes purchase price, consumables, price per page and pages per month, maintenance costs and warranty costs."],
  ["Features", "A cartridge costs $60 and prints 1,500 pages. What is the cost per page for supplies?", ["4 cents", "25 cents", "40 cents", "9 cents"], "60 divided by 1,500 is 0.04, so 4 cents a page."],
  ["Features", "What does MTBF tell you about a printer?", ["The average time it is expected to run before it fails", "The number of pages it prints each minute", "The amount of memory fitted", "The number of ink colours it uses"], "Mean time between failures is a reliability measure, alongside warranty and scheduled servicing."],
  ["Features", "What does an automatic document feeder (ADF) do?", ["Feeds a stack of pages into the device one at a time", "Melts toner onto the paper", "Moves the print head across the page", "Stores print jobs in a queue"], "The ADF saves placing each page on the glass by hand."],
  ["Features", "A multifunction device saves a scan to a shared location on the LAN. Which feature is this?", ["Scan to folder", "Scan to email", "Scan to cloud", "Print to file"], "Scan to folder sends the scan to a network folder. Scan to email attaches it to a message, and scan to cloud uploads it to cloud storage."],
  ["Inkjet", "Which is a disadvantage of inkjet printers?", ["The nozzles are prone to clog", "They have a high initial cost", "They are very noisy", "They need thermal paper"], "Inkjets are low cost and high resolution, but nozzles clog, cartridges can be expensive and the ink is wet for a few seconds."],
  ["Inkjet", "Which inkjet part holds the print head and moves it across the page?", ["Carriage", "Fuser", "Feeder", "Transfer roller"], "The carriage is moved by the belt. The feeder and roller move the paper."],
  ["Inkjet", "Which part sprays ink onto the paper?", ["Print head", "Imaging drum", "Pickup roller", "Hotend nozzle"], "The print head sprays ink through tiny nozzles."],
  ["Inkjet", "What does a duplexing assembly do?", ["Turns the page so both sides can be printed", "Prints two copies at once", "Feeds two sheets at a time", "Doubles the print resolution"], "Duplex means two-sided printing."],
  ["Laser", "What does a laser printer use in place of ink?", ["Toner", "Filament", "A ribbon", "Thermal paper"], "Toner is a fine powder that is fused to the paper with heat."],
  ["Laser", "Which is an advantage of laser printers?", ["Low cost per page", "Low initial cost", "They can print carbon copies", "They need no consumables"], "Laser printers have a low cost per page, high ppm and capacity, and the print comes out dry. The initial cost is high."],
  ["Laser", "What is the correct order of the first four laser printing steps?", ["Processing, charging, exposing, developing", "Charging, processing, developing, exposing", "Exposing, charging, processing, developing", "Processing, exposing, charging, developing"], "The full order is processing, charging, exposing, developing, transferring, fusing, cleaning."],
  ["Laser", "In which laser printing step are heat and pressure applied to the paper?", ["Fusing", "Transferring", "Developing", "Charging"], "The fuser melts the toner into the paper."],
  ["Laser", "In which step is the image written to the drum by the laser beam?", ["Exposing", "Developing", "Processing", "Cleaning"], "Charging conditions the drum; exposing writes the image to it."],
  ["Laser", "In which step is toner applied to the image on the drum?", ["Developing", "Transferring", "Exposing", "Fusing"], "Developing puts toner on the drum. Transferring moves it to the paper."],
  ["Laser", "What is the last step of the laser printing process?", ["Cleaning", "Fusing", "Transferring", "Processing"], "Excess toner is removed from the drum, ready for the next page."],
  ["Laser", "Which laser printer part holds the image as an electrical charge?", ["Imaging drum", "Fuser assembly", "Pickup roller", "Duplexing assembly"], "The laser changes the charge on the drum where the image should be."],
  ["Other types", "Which printer type is quiet, has few moving parts and uses no ink or toner?", ["Thermal", "Impact", "Inkjet", "Laser"], "A thermal printer uses heat on chemically treated paper."],
  ["Other types", "Which is a disadvantage of thermal printing?", ["Images degrade over time", "It is noisy", "Ribbons must be replaced often", "The ink smears when wet"], "Thermal paper is expensive, must be stored at room temperature, and the image fades. It cannot print in colour."],
  ["Other types", "Which printer type can print carbon copies?", ["Impact", "Laser", "Inkjet", "Thermal"], "An impact printer strikes the paper, so the force passes through to the copies beneath."],
  ["Other types", "Which two printers are impact printers?", ["Dot matrix and daisy wheel", "Inkjet and laser", "Thermal and 3D", "PDF and XPS"], "Both strike an inked ribbon against the paper."],
  ["Other types", "What does a virtual printer do with a print job?", ["Sends it to a file", "Sends it to the nearest laser printer", "Prints it in three dimensions", "Stores it in the printer's memory"], "Examples are print to file, print to PDF, print to XPS and print to image."],
  ["Other types", "What is cloud printing?", ["Sending a print job to a remote printer", "Printing on thermal paper", "Printing without a driver on a USB printer", "Saving a document as an image"], "The remote printer can be anywhere connected to the network."],
  ["Other types", "What is another name for 3D printers?", ["Additive manufacturing machines", "Subtractive milling machines", "Impact printers", "Virtual printers"], "The object is built up by adding material one layer at a time."],
  ["Other types", "Which 3D printer part heats the filament and extrudes it?", ["Hotend nozzle", "Print bed", "Axis", "Feeder"], "The feeder pushes filament to the hotend; the print bed is the platform the object is built on."],
  ["Install", "When is a printer installation complete?", ["When all its functions have been successfully tested", "When the power light comes on", "When the driver has been downloaded", "When the packing material is removed"], "Test double-sided printing, trays, colour modes, draft mode and, on an all-in-one, fax, copy, scan and print."],
  ["Install", "Which setting prints sets of a multi-page document arranged in order?", ["Collate", "Duplex", "Grayscale", "Landscape"], "Collate keeps each copy in page order. Duplex is two-sided printing."],
  ["Install", "A setting should apply to a single print job. Which method is used?", ["Per-document", "Global", "Firmware", "Spooling"], "The global method changes the default for every document; the per-document method is set in the application for one job."],
  ["Install", "What does printer calibration do?", ["Makes sure the print heads are aligned and can print on different media", "Adds memory to the printer", "Shares the printer on the network", "Removes excess toner from the drum"], "Calibration is done through the print driver software."],
  ["Install", "A printer will not print large, complex images. Which upgrade helps?", ["Adding printer memory", "Replacing the pickup rollers", "Changing the ribbon", "Using thermal paper"], "More memory increases printing speed and improves complex print job performance."],
  ["Sharing", "What must users have in order to use a printer shared from another Windows computer?", ["The correct print driver", "A Bluetooth adapter", "A dedicated print server", "Administrator rights on the printer's computer"], "Windows can automatically download the correct driver to them."],
  ["Sharing", "What must happen before a computer can print to a Bluetooth printer?", ["The two devices must be paired", "The printer must be given a static IP address", "A print server must be installed", "The printer must be calibrated"], "Bluetooth requires pairing between the computer and the printer."],
  ["Sharing", "Which is a purpose of a print server?", ["To store print jobs in a queue until the print device is ready", "To melt toner onto the paper", "To convert AC power to DC", "To align the print heads"], "Print servers also give clients access to print resources and give users feedback on the state of the printer."],
  ["Sharing", "What is a drawback of sharing a printer from a user's computer (a software print server)?", ["The printer is unavailable when that computer is down", "It needs a powerful dedicated processor", "It cannot use print drivers", "It only works with impact printers"], "Sharing may also slow that computer down."],
  ["Sharing", "Which print server suits a large network with multiple LANs and many users?", ["Dedicated print server", "Software print server", "Bluetooth pairing", "Ad hoc wireless"], "It needs a powerful processor, adequate storage for queued documents and adequate memory."],
  ["Maintain", "How should a thermal printer's heating element be cleaned?", ["With a cotton swab dampened with isopropyl alcohol", "With a household vacuum cleaner", "With warm soapy water", "With a wire brush"], "Compressed air or a lint-free cloth is used to remove debris."],

{ n: 9, title: "Virtualization and Cloud Computing", open: true,
  blurb: "Virtual machines, hypervisors and host requirements, cloud service models, cloud models and characteristics, and software-defined networking.",
  q: [
  ["Virtualization", "What does virtualization enable a single computer to do?", ["Host multiple independent virtual computers that share its hardware", "Run without an operating system", "Connect to the Internet without a NIC", "Print without a driver"], "The virtual computers are called virtual machines (VMs)."],
  ["Virtualization", "What is the relationship between virtualization and cloud computing?", ["Virtualization is the foundation that supports cloud computing", "They are two names for the same thing", "Cloud computing is required before virtualization can be used", "They are unrelated technologies"], "Virtualization separates the hardware from the VM instances; cloud computing separates the applications from the hardware."],
  ["Virtualization", "Which is a disadvantage of traditional dedicated servers?", ["Server sprawl", "Rapid elasticity", "Resource pooling", "Faster provisioning"], "Dedicated servers lead to wasted resources, single points of failure and server sprawl."],
  ["Virtualization", "What is the program that manages computer resources and the various VMs?", ["Hypervisor", "Device driver", "Print spooler", "SDN controller"], "The hypervisor gives VMs access to the CPUs, memory, disk controllers and NICs of the physical machine."],
  ["Virtualization", "What does each VM on a virtualized server run?", ["A complete and separate operating system", "A shared copy of the host's applications only", "Only the hypervisor", "Only a web browser"], "Different operating systems can run side by side on the same hardware."],
  ["Virtualization", "A new server is ready minutes after it is requested. Which advantage of server virtualization is this?", ["Faster server provisioning", "Support for legacy systems", "Less space required", "Improved disaster recovery"], "Creating a VM is much faster than buying and installing a physical server."],
  ["Virtualization", "An old application that needs an outdated OS keeps running inside a VM. Which advantage is this?", ["Support for legacy systems", "Less energy consumed", "Maximize server uptime", "Better use of resources"], "A VM can run an older operating system on modern hardware."],
  ["Virtualization", "Which is NOT listed as an advantage of server virtualization?", ["More physical servers required", "Less energy consumed", "Reduced cost", "Improved disaster recovery"], "Virtualization reduces the number of servers required."],
  ["Client-side", "What is the guest OS?", ["The operating system running in the VM", "The operating system of the physical computer", "The hypervisor's management console", "A temporary user account"], "The host OS is the operating system of the host computer; the guest OS runs in the VM."],
  ["Client-side", "What is the host computer?", ["The physical computer controlled by a user", "A virtual machine in a data center", "A cloud provider's portal", "The guest operating system"], "The VMs run on the host and share its hardware."],
  ["Client-side", "Why might a user run client-side virtualization?", ["To test new operating systems or software, or run older software", "To increase the speed of the host's CPU", "To remove the need for RAM", "To replace the network card"], "Client-side virtualization lets users run VMs on their local computer."],
  ["Hypervisors", "Where does a Type 1 hypervisor run?", ["Directly on the hardware of a host", "On top of a host operating system", "Inside a guest operating system", "In a web browser"], "Type 1 is the native, or bare-metal, hypervisor."],
  ["Hypervisors", "Which is a Type 1 hypervisor?", ["VMware vSphere / ESXi", "Oracle VirtualBox", "VMware Workstation", "Microsoft Word"], "Type 1 hypervisors include VMware vSphere/ESXi, Xen and Oracle VM Server."],
  ["Hypervisors", "Which is a Type 2 hypervisor?", ["Oracle VirtualBox", "Xen", "Oracle VM Server", "VMware ESXi"], "Type 2 hypervisors include VMware Workstation and Oracle VirtualBox."],
  ["Hypervisors", "Which type of hypervisor is typically used in data centers and cloud computing?", ["Type 1 (native)", "Type 2 (hosted)", "Type 3 (guest)", "Client-side"], "Type 1 is used with server virtualization."],
  ["Hypervisors", "Which type of hypervisor is commonly used with client-side virtualization?", ["Type 2 (hosted)", "Type 1 (native)", "Bare metal", "SDN controller"], "A Type 2 hypervisor works with the host computer's operating system."],
  ["Requirements", "Which processor feature does Hyper-V on Windows 10 require?", ["Second Level Address Translation (SLAT)", "Hyper-threading only", "A 32-bit architecture", "An integrated GPU"], "Hyper-V needs a 64-bit CPU with SLAT and VM Monitor Mode Extension support."],
  ["Requirements", "What is the minimum system RAM for Hyper-V on Windows 10?", ["4 GB", "1 GB", "2 GB", "16 GB"], "The course lists a minimum of 4 GB of system RAM and at least 15 GB of disk space per VM."],
  ["Requirements", "Which firmware and security features does the Windows 11 requirements table list?", ["UEFI, Secure Boot capable, and TPM 2.0", "Legacy BIOS and TPM 1.2", "A CMOS battery and jumper", "PXE and Wake-on-LAN"], "Windows 11 needs UEFI, Secure Boot capability and Trusted Platform Module 2.0."],
  ["Requirements", "A host has 16 GB of RAM and needs 4 GB for itself. How many VMs with 4 GB each can run at once?", ["3", "4", "5", "2"], "16 minus 4 leaves 12 GB, which is three VMs at 4 GB."],
  ["Requirements", "A hypervisor reports that hardware virtualization is unavailable on a modern PC. What should be checked first?", ["That virtualization support is enabled in the BIOS/UEFI", "That the monitor supports 720p", "That the printer driver is current", "That the keyboard layout is correct"], "Virtualization extensions are often disabled by default in the firmware settings."],
  ["Cloud services", "Which cloud service provides applications over the network on a subscription basis for end users?", ["SaaS", "PaaS", "IaaS", "SDN"], "Software as a Service, for example web email or online office software."],
  ["Cloud services", "Which cloud service is typically requested by application and software developers?", ["PaaS", "SaaS", "IaaS", "ITaaS"], "Platform as a Service includes the tools, OS and application stack used to deliver applications."],
  ["Cloud services", "Which cloud service provides network, computers and storage?", ["IaaS", "SaaS", "PaaS", "SD-WAN"], "Infrastructure as a Service is typically used by infrastructure and network architects."],
  ["Cloud services", "A company rents virtual servers and installs and manages its own operating systems on them. Which model is this?", ["IaaS", "SaaS", "PaaS", "Community cloud"], "With IaaS the customer manages the OS and everything above it."],
  ["Cloud services", "How do organizations typically pay cloud providers?", ["A usage fee based on user access and usage of services", "A single one-off hardware purchase", "They are never charged", "By supplying their own servers to the provider"], "Cloud services are owned and hosted by service providers."],
  ["Cloud models", "Which cloud model is made available to the general population?", ["Public cloud", "Private cloud", "Community cloud", "Hybrid cloud"], "Public cloud services may be free or pay per use, and are reached over the Internet."],
  ["Cloud models", "Which cloud model is intended for one specific organization or entity?", ["Private cloud", "Public cloud", "Hybrid cloud", "Community cloud"], "A private cloud can be built on the organization's own network or managed by an outside organization with strict access security."],
  ["Cloud models", "Which cloud model is made up of two or more clouds connected by a single architecture?", ["Hybrid cloud", "Public cloud", "Private cloud", "Community cloud"], "For example, part private and part public."],
  ["Cloud models", "Several healthcare organizations share a cloud customized to their regulations. Which model is this?", ["Community cloud", "Public cloud", "Hybrid cloud", "Private cloud"], "A community cloud is for the exclusive use of a specific community."],
  ["Characteristics", "Which cloud characteristic means resources scale up and down quickly with demand?", ["Rapid elasticity", "Resource pooling", "Broad network access", "Measured service"], "Services are provisioned and deprovisioned rapidly."],
  ["Characteristics", "Which cloud characteristic means customers are billed for what they actually use?", ["Measured and metered service", "On-demand self-service", "Rapid elasticity", "Broad network access"], "Usage is monitored and measured, like a utility."],
  ["Characteristics", "A user creates a new virtual server from a web portal without contacting the provider. Which characteristic is this?", ["On-demand (self-service)", "Resource pooling", "Measured service", "Community cloud"], "The customer provisions services when needed."],
  ["Characteristics", "Which characteristic describes a provider's resources being shared between many customers?", ["Resource pooling", "Rapid elasticity", "Broad network access", "On-demand self-service"], "Pooling is made possible by virtualization."],
  ["SDN", "How many layers are in the SDN model?", ["Three", "Two", "Five", "Seven"], "Application layer, control layer and infrastructure layer."],
  ["SDN", "Which SDN layer contains the SDN controller?", ["Control layer", "Application layer", "Infrastructure layer", "Transport layer"], "The controller sits in the center and controls the application and infrastructure layers."],
  ["SDN", "Which SDN layer is the physical and virtual devices that route and switch traffic?", ["Infrastructure layer", "Application layer", "Control layer", "Session layer"], "The infrastructure layer is at the bottom of the model."],
  ["SDN", "What is the API between the SDN controller and the application layer called?", ["Northbound API", "Southbound API", "Eastbound API", "Hypervisor API"], "The southbound API is between the controller and the infrastructure layer."],
  ["SDN", "Which is a security feature built into SD-WAN solutions?", ["Sandboxing", "Toner fusing", "Disk defragmenting", "Screen locking"], "SD-WAN solutions include firewalls, AI security, encryption, sandboxing and IPS."],
  ["SDN", "Why is scripting used in cloud environments?", ["Services must be provisioned and deprovisioned rapidly", "It replaces the need for hypervisors", "It increases the monitor resolution", "It removes the need for a network"], "SDN is often used to perform these operations."]
  ],

  blurb: "The desktop, Task Manager and File Explorer, Control Panels, administrative tools and the Registry, command-line tools, Windows networking, maintenance and troubleshooting.",
  q: [

  ["File Explorer", "What is the default maximum path length in Windows 10?", ["260 characters", "255 characters", "512 characters", "64 characters"], "A filename itself can be up to 255 characters."],

  ["Control Panel", "Which command opens the Control Panel from the command prompt?", ["control", "panel", "msconfig", "config"], "System administrators generally prefer the Control Panel to the Settings app."],

  ["Control Panel", "What does Credential Manager manage?", ["Passwords used for websites and Windows applications", "Device drivers", "Power plans", "File associations"], "Web credentials are saved only for Internet Explorer and Edge."],

  ["Control Panel", "From which Windows 10 version is HomeGroup no longer available?", ["1803", "1507", "1607", "2004"], "Homegroups were used in Windows 7 and 8; Windows 8.1 could join but not create one."],
  ["Control Panel", "What does the refresh rate of a display describe?", ["How often the screen image is redrawn, in hertz", "The number of pixels across the screen", "The number of colours", "The physical screen size"], "The higher the refresh rate, the steadier the image."],

  ["Admin tools", "Which Registry root key holds file associations?", ["HKEY_CLASSES_ROOT", "HKEY_USERS", "HKEY_CURRENT_CONFIG", "HKEY_CURRENT_USER"], "Windows uses it when you ask it to run a file or view a directory."],

  ["Applications", "An older program will not run properly on Windows 10. Where do you configure it?", ["The Compatibility tab of the executable's Properties", "The Boot tab of msconfig", "The Sharing tab", "Credential Manager"], "You can run the compatibility troubleshooter or set the mode manually."],

  ["Network attacks", "What does an attacker use to determine which IP addresses on a target network are active?", ["A ping sweep", "A degaussing wand", "A mantrap", "A hash"], "It is part of reconnaissance."],

  ["Data", "Which permission lets a user see the contents of files and folders and run programs, but not change them?", ["Read and Execute", "Full Control", "Modify", "Write"], "Write allows creating and changing files and folders."],
  ["Data", "Which statement about the Encrypting File System (EFS) is true?", ["It is directly linked to a specific user account", "It encrypts the entire drive", "It needs a TPM chip", "It works only on removable drives"], "Only the user that encrypted the data can access it."],
  ["Data", "What does BitLocker require?", ["At least two volumes on the disk and the TPM enabled in BIOS", "A FAT32 file system", "An Internet connection at every boot", "A degaussing wand"], "BitLocker encrypts an entire hard drive."],
  ["Data", "What is the Trusted Platform Module (TPM)?", ["A chip on the motherboard that stores encryption keys, digital certificates and passwords", "A Windows backup tool", "A type of firewall", "A wireless standard"], "BitLocker uses it."],
  ["Data", "Which statement about BitLocker To Go is true?", ["It encrypts removable drives and does not use a TPM chip", "It encrypts only email", "It requires two TPM chips", "It cannot use a password"], "It still provides encryption and requires a password."],
  ["Data destruction", "Which method uses powerful magnets to erase a hard drive?", ["Degaussing", "Standard format", "Secure erase", "Defragmenting"], "A degaussing wand needs about 2 minutes over exposed platters."],
  ["Data destruction", "What is data wiping software also known as?", ["Secure erase", "Low-level format", "Degaussing", "Defragmentation"], "It overwrites existing data multiple times."],
  ["Data destruction", "Why is degaussing not effective on SSDs?", ["SSDs use flash memory, not magnetic platters", "SSDs are encrypted by default", "SSDs have no data", "SSDs are too small"], "Perform a secure erase on SSDs and hybrid drives."],
  ["Data destruction", "What does a standard (high-level) format create?", ["A boot sector and a file system", "Sector markers on the disk surface", "A magnetic field", "A recovery partition"], "A low-level format marks the surface with sector markers, usually at the factory."],
  ["Data destruction", "Why might a printer need to be wiped?", ["It may contain a hard drive that caches printed or scanned documents", "Its toner stores passwords", "Its rollers hold magnetic data", "Its firmware is always infected"], "Devices besides computers store data."],
  ["Windows", "Which three levels of password protection can be used on a computer?", ["BIOS, login, network", "User, group, other", "Read, write, execute", "Open, WEP, WPA"], "BIOS prevents booting and changing BIOS settings."],
  ["Windows", "Which statement about BIOS passwords is true?", ["All users share BIOS passwords, regardless of user account", "Each Windows user has a separate BIOS password", "They are stored in Active Directory", "They encrypt the hard drive"], "UEFI passwords can be per user, with an authentication server."],
  ["Windows", "Which Windows 10 sign-in option uses facial recognition or a fingerprint?", ["Windows Hello", "Picture password", "Dynamic lock", "PIN"], "Dynamic lock locks Windows when a paired device goes out of range."],
  ["Windows", "Which sign-in feature locks Windows when a pre-paired phone goes out of range?", ["Dynamic lock", "Windows Hello", "Picture password", "BitLocker"], "It uses a paired device such as a cell phone."],
  ["Windows", "What is the recommended minimum length of a password in the course guidelines?", ["Eight characters or more", "Four characters", "Six characters", "Twenty characters"], "Also use complexity, variety and expiration."],
  ["Windows", "Which command opens the Local Security Policy tool in all versions of Windows?", ["secpol.msc", "lusrmgr.msc", "wf.msc", "msconfig"], "It enforces security settings on stand-alone computers."],
  ["Windows", "Which policy is used to prevent brute-force attacks?", ["Account Lockout Policy", "Audit Policy", "Acceptable use policy", "Password history"], "It also protects against a dictionary attack."],
  ["Windows", "What is a dictionary attack?", ["A brute-force attack that tries every word in a dictionary", "An attack on DNS servers", "Reading passwords over someone's shoulder", "Flooding a server with SYN packets"], "Account lockout limits the number of guesses."],
  ["Windows", "Where do you enable logging of successful and unsuccessful login attempts?", ["Local Policies > Audit Policy", "Account Policies > Password Policy", "Control Panel > AutoPlay", "Windows Firewall"], "The Local Policy section also holds user rights and security options."],
  ["Windows", "What should be done when an employee leaves an organization?", ["Immediately disable the account or change the login credentials", "Leave the account active for 90 days", "Give the password to a colleague", "Convert the account to Guest"], "This is terminating employee access."],
  ["Windows", "Which command opens the Local Users and Groups Manager?", ["lusrmgr.msc", "secpol.msc", "wf.msc", "dxdiag"], "It manages users and groups stored locally on a computer."],
  ["Windows", "Where are domain accounts stored?", ["In Active Directory on a Windows Server domain controller", "In the Local Security Accounts database of each PC", "In the BIOS", "In the browser's password manager"], "Only domain administrators can create them."],
  ["Windows", "What do organizational units (OUs) do?", ["Subdivide a domain into smaller administrative units", "Encrypt user folders", "Block pop-up windows", "Forward ports"], "They are managed in Active Directory Users and Computers."],
  ["Firewall", "What is Windows Defender Firewall an example of?", ["A host-based software firewall", "A hardware firewall", "A proxy server", "A DMZ"], "It is installed by default with Windows."],
  ["Firewall", "Which command opens Windows Defender Firewall with Advanced Security?", ["wf.msc", "secpol.msc", "firewall.cpl32", "lusrmgr.msc"], "It provides inbound and outbound rules, connection security rules and monitoring."],
  ["Firewall", "What do connection security rules do?", ["Secure traffic between two computers that have the same rules defined", "Block all outbound traffic", "Hide the SSID", "Encrypt the hard drive"], "Both computers must have the rules enabled."],
  ["Web", "Which browser add-on type is now rarely used because of many vulnerabilities?", ["Plug-ins", "Themes", "Apps", "Extensions"], "HTML5 is now the preferred method."],
  ["Web", "What do TLS and digital certificates provide for a website?", ["Validation of the host's identity and encryption between server and browser", "Faster page loading", "Protection from power failure", "Automatic backups"], "Certificate authorities issue and sign certificates."],
  ["Web", "Which statement about private (InPrivate) browsing is true?", ["It does not make the user anonymous", "It hides your IP address from websites", "It removes malware", "It encrypts the hard drive"], "It erases history, form data and cookies when closed."],
  ["Web", "Which Microsoft Edge feature detects phishing websites and checks downloads against known malicious files?", ["SmartScreen Filter", "ActiveX filtering", "InPrivate", "Dynamic lock"], "It is found under Privacy, search, and services."],
  ["Web", "What is the most secure setting for AutoPlay?", ["Turned off", "Run every time", "Ask every time", "Open folder to view files"], "Older Windows AutoRun executed autorun.inf from new media."],
  ["Web", "What is a service pack?", ["A comprehensive update combining patches and upgrades", "A set of printer rollers", "A hardware firewall", "A password manager"], "Patches are code updates that prevent newly discovered attacks."],
  ["Wireless", "What does hash encoding ensure?", ["The integrity of the message", "The confidentiality of the message", "The speed of the connection", "The identity of the router"], "SHA is replacing the older MD5."],
  ["Wireless", "Which type of encryption uses an identical key on both sides?", ["Symmetric encryption", "Asymmetric encryption", "Hash encoding", "Port triggering"], "AES and 3DES are examples."],
  ["Wireless", "Which is an example of asymmetric encryption?", ["RSA", "AES", "3DES", "SHA"], "It uses a public key and a private key."],
  ["Wireless", "Which statement about disabling the SSID broadcast is true?", ["It provides very little security", "It encrypts all traffic", "It prevents all attacks", "It makes WEP secure"], "The SSID can be entered manually or intercepted in transit."],
  ["Wireless", "Why is WEP easy to crack?", ["The encryption key never changes when exchanging packets", "It uses AES", "It has no SSID", "It requires a RADIUS server"], "WPA used TKIP, which changes the key for each packet."],
  ["Wireless", "Which encryption does WPA2 use?", ["AES", "TKIP only", "WEP", "MD5"], "WPA2 is the industry standard; WPA3 was ratified in 2018."],
  ["Wireless", "What is the security best practice for WPS?", ["Turn it off", "Leave it on with the default PIN", "Use it in place of WPA2", "Enable it on every guest device"], "It is vulnerable to brute-force attack."],
  ["Wireless", "Which firewall type keeps track of the state of network connections?", ["Stateful packet inspection (SPI)", "Packet filter", "Proxy", "Application layer"], "Packets not part of a known connection are dropped."],
  ["Wireless", "Which is true of a hardware firewall compared with a software firewall?", ["It can protect multiple computers", "It uses the computer's resources", "It protects only the computer it is installed on", "It is included free with Windows"], "It is a dedicated component with no impact on computer performance."],
  ["Wireless", "What is port triggering?", ["Temporarily forwarding data through inbound ports to a specific device", "Permanently opening every port", "Blocking all inbound traffic", "Changing the SSID automatically"], "Port forwarding is a rule-based method of directing traffic between networks."],
  ["Wireless", "What does UPnP do?", ["Lets devices dynamically forward traffic through ports without user configuration", "Encrypts wireless traffic with AES", "Updates router firmware", "Filters MAC addresses"], "It is used for streaming media and hosting games."],
  ["Troubleshoot", "What is a common first step when testing a theory for a security problem?", ["Disconnect from the network", "Reinstall the printer", "Lower the screen resolution", "Defragment the drive"], "Then update signatures and scan."],
  ["Troubleshoot", "A wireless network using 128-bit WEP has been compromised. What is the solution?", ["Upgrade to WPA2 or WPA3", "Hide the SSID", "Use a longer WEP key", "Enable WPS"], "WEP is easy to crack."],
  ["Troubleshoot", "Email contacts report spam coming from your address. What is the probable cause?", ["Your email has been hijacked", "Your firewall is too strict", "Your SSID is hidden", "Your TPM is disabled"], "Change the password and scan for malware."],
  ["Troubleshoot", "An unknown repair person is looking under keyboards. What are they probably looking for?", ["Written passwords", "Loose cables", "Serial numbers for warranty", "Dust"], "Contact security; never hide passwords near the work area."]

  cards: [
  ["Malware", "Malicious software, typically installed without the user's knowledge. The most common threat."],
  ["Virus", "Attaches to code, software or documents. Requires human action to propagate."],
  ["Trojan horse", "A program that looks useful but also carries malicious code."],
  ["Worm", "Self-replicating. Propagates automatically without user action by exploiting vulnerabilities."],
  ["Ransomware", "Encrypts the user's files and demands a ransom for the decryption key."],
  ["Rootkit", "Difficult to detect. Used to gain admin level access to a computer."],
  ["Spyware", "Gathers information about the user and sends it to cybercriminals."],
  ["Adware", "Displays unsolicited advertising with pop-ups and toolbars, or redirects webpages."],
  ["Anti-malware detection", "Signatures of known malware, plus heuristic techniques that detect malicious behaviour."],
  ["Mirrors", "Multiple download sites for signature files. Link to them from the manufacturer's website."],
  ["Remediation steps", "Identify, quarantine, disable System Restore, remediate, schedule scans and updates, enable System Restore, educate the user."],
  ["Reconnaissance", "Information gathering: searches and whois, ping sweep, port scan, vulnerability scan, exploit."],
  ["DoS", "Overwhelms a target with false requests to deny service to legitimate users."],
  ["DDoS", "An amplified DoS attack using many infected hosts called zombies."],
  ["DNS poisoning", "A host accepts false DNS records pointing to malicious servers."],
  ["Man-in-the-middle", "An attacker intercepts communication between two hosts."],
  ["Replay", "A captured authenticated packet is altered and sent to the original destination."],
  ["Spoofing", "The attacker forges an IP address to gain access to resources."],
  ["SYN flood", "A DoS attack that exploits the TCP three-way handshake."],
  ["Zero-day", "The day an unknown vulnerability is discovered by the vendor. Exploitable until patched."],
  ["Defense in depth", "A layered approach to security, with devices and services working together."],
  ["Social engineering", "Manipulating individuals into performing actions or divulging confidential information."],
  ["Pretexting", "Pretending to need personal data to confirm the recipient's identity."],
  ["Phishing", "Fraudulent email disguised as being from a trusted source."],
  ["Spear phishing", "A targeted phishing attack for a specific individual or organization."],
  ["Something for something", "Requesting personal information in exchange for something. Quid pro quo."],
  ["Baiting", "Leaving a malware-infected flash drive in a public location."],
  ["Tailgating", "Following an authorized person into a secure area."],
  ["Shoulder surfing", "Looking over someone's shoulder to steal information."],
  ["Dumpster diving", "Searching through trash for confidential information."],
  ["Security policy", "A set of security objectives for the network, data and computers. Constantly evolving."],
  ["Security policy categories", "Identification and authentication, password, acceptable use, remote access, network maintenance, incident handling."],
  ["Secure locks", "Conventional, deadbolt, electronic, token-based, biometric, multifactor."],
  ["Mantrap", "A small room with two doors; one must close before the other opens. Prevents tailgating."],
  ["MDM and MAM", "MDM manages devices and onboarding; MAM sets policies for the applications allowed on a device."],
  ["BYOD", "Bring Your Own Device."],
  ["Data loss / exfiltration", "Data is lost, stolen, or leaked to the public."],
  ["Principle of least privilege", "Limit users to only the resources they need."],
  ["File and folder permissions", "Full Control, Modify, Read and Execute, Read, Write."],
  ["EFS", "Encrypting File System. Encrypts data; linked to a specific user account."],
  ["BitLocker", "Encrypts an entire hard drive. Needs two volumes and the TPM enabled in BIOS."],
  ["TPM", "Trusted Platform Module. A motherboard chip that stores encryption keys, certificates and passwords."],
  ["BitLocker To Go", "BitLocker for removable drives. No TPM; requires a password."],
  ["Data wiping software", "Secure erase. Overwrites existing data multiple times."],
  ["Degaussing", "Powerful magnets disrupt the magnetic field on a hard drive. Not effective on SSDs."],
  ["Low-level and standard format", "Low-level marks sector markers at the factory. Standard creates a boot sector and file system."],
  ["Three levels of password", "BIOS, login, network."],
  ["Windows 10 sign-in options", "Windows Hello, PIN, picture password, dynamic lock."],
  ["Strong password guidelines", "Minimum length of eight, complexity, variety, expiration."],
  ["Local Security Policy", "secpol.msc. Enforces security settings on stand-alone computers."],
  ["Account Lockout Policy", "Prevents brute-force and dictionary attacks."],
  ["Audit Policy", "Logs successful and unsuccessful login attempts."],
  ["Active Directory", "A database of all computers, users and services in a domain, on a domain controller."],
  ["Organizational unit (OU)", "Subdivides a domain into smaller administrative units."],
  ["Windows Defender Firewall", "A host-based software firewall with rules for private, public and domain networks."],
  ["wf.msc", "Windows Defender Firewall with Advanced Security: inbound, outbound and connection security rules."],
  ["Browser add-ons", "Plug-ins, extensions, themes, apps, default search provider."],
  ["TLS and certificates", "Validate a website's identity and encrypt data between server and browser."],
  ["InPrivate browsing", "Deletes temporary files and cookies when the session ends. Does not make the user anonymous."],
  ["SmartScreen Filter", "Detects phishing websites and known malicious downloads in Microsoft Edge."],
  ["AutoPlay", "Prompts for an action when media is inserted. Most secure when turned off."],
  ["Hash encoding", "Ensures integrity using a message digest. SHA is replacing MD5."],
  ["Symmetric encryption", "One identical key on both sides. AES, 3DES."],
  ["Asymmetric encryption", "A public key and a private key. RSA."],
  ["SSID", "The name of the wireless network. Hiding it provides very little security."],
  ["WEP / WPA / WPA2 / WPA3", "WEP: key never changes. WPA: TKIP. WPA2: AES, the standard. WPA3: ratified 2018."],
  ["WPS", "Wi-Fi Protected Setup. Vulnerable to brute-force attack; turn it off."],
  ["Hardware vs software firewall", "Hardware protects multiple computers with no performance impact; software protects one computer."],
  ["Firewall types", "Packet filter, stateful packet inspection (SPI), application layer, proxy."],
  ["Port forwarding", "A rule-based method of directing traffic between devices on separate networks."],
  ["Port triggering", "Temporarily forwards data through inbound ports to a specific device."],
  ["UPnP", "Lets devices dynamically forward traffic through ports without user configuration."]
